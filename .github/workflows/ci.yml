# CI is uredu gating uredu: the binary built from this commit runs the same rules
# (uredu.ts) that gate commits and Claude Code sessions, over everything since the base.
name: ci

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:

jobs:
  uredu:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Base
        id: base
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          # a PR is proven against its target; a push against what the branch was before it.
          # A new branch or the first push has no "before", so prove the whole history.
          base=${PR_BASE:-$BEFORE}
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base=$(git rev-list --max-parents=0 HEAD)
          fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"
      - run: ./dist/uredu plan --base ${{ steps.base.outputs.sha }}
      - run: ./dist/uredu run --base ${{ steps.base.outputs.sha }} --no-cache
